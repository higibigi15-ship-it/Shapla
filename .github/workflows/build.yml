          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.UUID

          val ShaplaDeepGreen = Color(0xFF0B4636)
          val ShaplaLeafGreen = Color(0xFF10B981)
          val ShaplaAmber = Color(0xFFD97706)
          val ShaplaBg = Color(0xFFF0F2F5)

          object ShaplaSoundEngine {
              private var callTimer: CountDownTimer? = null
              private var isCallRinging = false
              private val handler = Handler(Looper.getMainLooper())
              private var toneGen: ToneGenerator? = null

              init {
                  try { toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100) } catch (e: Exception) { e.printStackTrace() }
              }

              fun playTriplePing(context: Context) {
                  try {
                      toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 100)
                      handler.postDelayed({ toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 100) }, 130)
                      handler.postDelayed({ toneGen?.startTone(ToneGenerator.TONE_PROP_ACK, 140) }, 260)
                      val v = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 80, 80, 80, 80, 100), -1))
                      } else { v?.vibrate(200) }
                  } catch (e: Exception) { e.printStackTrace() }
              }

              fun start40sCall(context: Context, onFinish: () -> Unit) {
                  stopCall(context)
                  isCallRinging = true
                  val callGen = try { ToneGenerator(AudioManager.STREAM_VOICE_CALL, 100) } catch (e: Exception) { toneGen }

                  val runnable = object : Runnable {
                      override fun run() {
                          if (isCallRinging) {
                              callGen?.startTone(ToneGenerator.TONE_PROP_BEEP2, 220)
                              handler.postDelayed({ if (isCallRinging) callGen?.startTone(ToneGenerator.TONE_PROP_BEEP2, 220) }, 250)
                              handler.postDelayed(this, 1200)
                          }
                      }
                  }
                  handler.post(runnable)

                  callTimer = object : CountDownTimer(40000, 1000) {
                      override fun onTick(m: Long) {}
                      override fun onFinish() { stopCall(context); onFinish() }
                  }.start()
              }

              fun stopCall(context: Context? = null) {
                  isCallRinging = false
                  callTimer?.cancel()
                  callTimer = null
                  toneGen?.stopTone()
              }
          }

          object ImageEditUtils {
              fun rotate(src: Bitmap, angle: Float): Bitmap {
                  val m = Matrix().apply { postRotate(angle) }
                  return Bitmap.createBitmap(src, 0, 0, src.width, src.height, m, true)
              }

              fun cropSquare(src: Bitmap): Bitmap {
                  val s = minOf(src.width, src.height)
                  return Bitmap.createBitmap(src, (src.width - s) / 2, (src.height - s) / 2, s, s)
              }

              fun applyFilter(src: Bitmap, type: String): Bitmap {
                  val out = Bitmap.createBitmap(src.width, src.height, src.config ?: Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(out)
                  val paint = Paint()
                  val cm = ColorMatrix()
                  when (type) {
                      "grayscale" -> cm.setSaturation(0f)
                      "sepia" -> {
                          cm.setScale(1f, 0.95f, 0.82f, 1f)
                          val sep = ColorMatrix(floatArrayOf(
                              0.393f, 0.769f, 0.189f, 0f, 0f,
                              0.349f, 0.686f, 0.168f, 0f, 0f,
                              0.272f, 0.534f, 0.131f, 0f, 0f,
                              0f, 0f, 0f, 1f, 0f
                          ))
                          cm.postConcat(sep)
                      }
                      "warm" -> cm.setScale(1.2f, 1.0f, 0.8f, 1f)
                  }
                  paint.colorFilter = ColorMatrixColorFilter(cm)
                  canvas.drawBitmap(src, 0f, 0f, paint)
                  return out
              }
          }

          data class VaultFolder(val id: String, val name: String, val parentId: String? = null, val isTrash: Boolean = false)
          data class VaultFile(val id: String, val folderId: String?, val title: String, val idNumber: String, val imagePath: String, val isTrash: Boolean = false)
          data class PostItem(val id: String, val authorName: String, val timeAgo: String, var content: String, val imagePath: String? = null, var likes: Int = 18, var isLiked: Boolean = false)

          fun hashPwd(p: String): String = MessageDigest.getInstance("SHA-256").digest(p.toByteArray()).joinToString("") { "%02x".format(it) }

          fun saveBitmapToFile(context: Context, bmp: Bitmap, fileName: String): File {
              val dir = File(context.filesDir, "vault_photos").apply { if (!exists()) mkdirs() }
              val file = File(dir, fileName)
              FileOutputStream(file).use { bmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
              return file
          }

          fun shareImageFile(context: Context, filePath: String) {
              try {
                  val file = File(filePath)
                  if (!file.exists()) { Toast.makeText(context, "ফাইল নেই!", Toast.LENGTH_SHORT).show(); return }
                  val uri = FileProvider.getUriForFile(context, "com.shapla.app.fileprovider", file)
                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "image/jpeg"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  context.startActivity(Intent.createChooser(intent, "Shapla — শেয়ার করুন"))
              } catch (e: Exception) {
                  Toast.makeText(context, "শেয়ার ব্যর্থ: ${e.message}", Toast.LENGTH_SHORT).show()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("shapla_users", Context.MODE_PRIVATE)

                  setContent {
                      var isSplashActive by remember { mutableStateOf(true) }
                      var currentScreen by remember { mutableStateOf("login") }
                      var loggedInUser by remember { mutableStateOf("") }

                      LaunchedEffect(Unit) {
                          kotlinx.coroutines.delay(1500)
                          isSplashActive = false
                      }

                      if (isSplashActive) {
                          BrandedSplashScreen()
                      } else {
                          when (currentScreen) {
                              "login" -> LoginScreen(
                                  prefs = prefs,
                                  onSuccess = { user -> loggedInUser = user; currentScreen = "main" },
                                  onGoRegister = { currentScreen = "register" }
                              )
                              "register" -> RegisterScreen(
                                  prefs = prefs,
                                  onSuccess = { user -> loggedInUser = user; currentScreen = "main" },
                                  onGoLogin = { currentScreen = "login" }
                              )
                              "main" -> MainAppHub(
                                  userName = loggedInUser,
                                  onLogout = { loggedInUser = ""; currentScreen = "login" }
                              )
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  ShaplaSoundEngine.stopCall(this)
              }
          }

          @Composable
          fun BrandedSplashScreen() {
              Box(
                  modifier = Modifier.fillMaxSize().background(Color.White),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(
                          modifier = Modifier.size(110.dp).clip(RoundedCornerShape(24.dp)).background(ShaplaDeepGreen),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              painter = painterResource(id = R.drawable.ic_shapla_foreground),
                              contentDescription = "Shapla Logo",
                              tint = Color.Unspecified,
                              modifier = Modifier.size(90.dp)
                          )
                      }
                      Spacer(modifier = Modifier.height(18.dp))
                      Text(text = "Shapla", fontSize = 32.sp, fontWeight = FontWeight.ExtraBold, color = ShaplaDeepGreen)
                      Text(text = "শাপলা", fontSize = 18.sp, fontWeight = FontWeight.SemiBold, color = ShaplaLeafGreen)
                      Spacer(modifier = Modifier.height(6.dp))
                      Text(text = "কাজ, সেবা, সব একসাথে।", fontSize = 14.sp, color = Color.DarkGray)
                      Spacer(modifier = Modifier.height(28.dp))
                      Text(text = "Designed & Owned by Mohammad Israfil Hossain", fontSize = 11.sp, color = Color.Gray)
                  }
              }
          }

          @Composable
          fun LoginScreen(prefs: android.content.SharedPreferences, onSuccess: (String) -> Unit, onGoRegister: () -> Unit) {
              var phone by remember { mutableStateOf("") }
              var pwd by remember { mutableStateOf("") }
              var err by remember { mutableStateOf<String?>(null) }

              Column(
                  modifier = Modifier.fillMaxSize().background(Color.White).padding(28.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("Shapla", fontSize = 36.sp, fontWeight = FontWeight.ExtraBold, color = ShaplaDeepGreen)
                  Text("কাজ, সেবা, সব একসাথে।", fontSize = 15.sp, color = ShaplaLeafGreen)
                  Spacer(modifier = Modifier.height(24.dp))
                  if (err != null) Text(err!!, color = Color.Red, fontSize = 13.sp, modifier = Modifier.padding(bottom = 8.dp))

                  OutlinedTextField(value = phone, onValueChange = { phone = it }, label = { Text("মোবাইল নম্বর") }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(10.dp))
                  OutlinedTextField(value = pwd, onValueChange = { pwd = it }, label = { Text("পাসওয়ার্ড") }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          val saved = prefs.getString("pwd_$phone", null)
                          if (saved != null && saved == hashPwd(pwd)) { err = null; onSuccess(phone) } else { err = "ভুল মোবাইল বা পাসওয়ার্ড!" }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen),
                      shape = RoundedCornerShape(12.dp)
                  ) { Text("লগইন করুন (Log In)", fontWeight = FontWeight.Bold) }

                  Spacer(modifier = Modifier.height(12.dp))
                  TextButton(onClick = onGoRegister) { Text("নতুন অ্যাকাউন্ট তৈরি করুন", color = ShaplaLeafGreen) }
              }
          }

          @Composable
          fun RegisterScreen(prefs: android.content.SharedPreferences, onSuccess: (String) -> Unit, onGoLogin: () -> Unit) {
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var pwd by remember { mutableStateOf("") }

              Column(
                  modifier = Modifier.fillMaxSize().background(Color.White).padding(28.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("নতুন অ্যাকাউন্ট", fontSize = 28.sp, fontWeight = FontWeight.Bold, color = ShaplaDeepGreen)
                  Spacer(modifier = Modifier.height(18.dp))
                  OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("পুরো নাম") }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(10.dp))
                  OutlinedTextField(value = phone, onValueChange = { phone = it }, label = { Text("মোবাইল নম্বর") }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(10.dp))
                  OutlinedTextField(value = pwd, onValueChange = { pwd = it }, label = { Text("পাসওয়ার্ড (৬+ সংখ্যা)") }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (phone.isNotBlank() && pwd.length >= 6) {
                              prefs.edit().putString("pwd_$phone", hashPwd(pwd)).putString("name_$phone", name).apply()
                              onSuccess(phone)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen),
                      shape = RoundedCornerShape(12.dp)
                  ) { Text("নিবন্ধন সম্পন্ন করুন", fontWeight = FontWeight.Bold) }
                  Spacer(modifier = Modifier.height(12.dp))
                  TextButton(onClick = onGoLogin) { Text("লগইন পেজে ফিরুন", color = ShaplaDeepGreen) }
              }
          }

          @Composable
          fun MainAppHub(userName: String, onLogout: () -> Unit) {
              val context = LocalContext.current
              var activeTab by remember { mutableStateOf("home") }
              var lastBackPressTime by remember { mutableStateOf(0L) }

              var previewImageFile by remember { mutableStateOf<String?>(null) }
              var editingImageFile by remember { mutableStateOf<String?>(null) }
              var isCallActive by remember { mutableStateOf(false) }

              BackHandler(enabled = true) {
                  when {
                      editingImageFile != null -> editingImageFile = null
                      previewImageFile != null -> previewImageFile = null
                      activeTab != "home" -> activeTab = "home"
                      else -> {
                          val now = System.currentTimeMillis()
                          if (now - lastBackPressTime < 2000) {
                              (context as? ComponentActivity)?.finish()
                          } else {
                              lastBackPressTime = now
                              Toast.makeText(context, "অ্যাপ থেকে বের হতে আবার চাপুন", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              Scaffold(
                  bottomBar = {
                      Surface(color = Color.White, shadowElevation = 8.dp, modifier = Modifier.fillMaxWidth()) {
                          Row(
                              modifier = Modifier.fillMaxWidth().navigationBarsPadding().padding(vertical = 4.dp),
                              horizontalArrangement = Arrangement.SpaceAround,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              NavBarBtn(icon = Icons.Default.Home, label = "Home", isSel = activeTab == "home") { activeTab = "home" }
                              NavBarBtn(icon = Icons.Default.Lock, label = "Vault", isSel = activeTab == "vault") { activeTab = "vault" }
                              NavBarBtn(icon = Icons.Default.Star, label = "Job", isSel = activeTab == "job") { activeTab = "job" }
                              NavBarBtn(icon = Icons.Default.Settings, label = "Settings", isSel = activeTab == "settings") { activeTab = "settings" }
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.fillMaxSize().padding(padding).background(ShaplaBg)) {
                      when (activeTab) {
                          "home" -> HomeScreen(
                              userName = userName,
                              onCallTest = {
                                  isCallActive = true
                                  ShaplaSoundEngine.start40sCall(context) { isCallActive = false }
                              }
                          )
                          "vault" -> AdvancedVaultScreen(
                              userName = userName,
                              onPreview = { previewImageFile = it },
                              onEditPhoto = { editingImageFile = it }
                          )
                          "job" -> JobScreen()
                          "settings" -> SettingsScreen(userName = userName, onLogout = onLogout)
                      }

                      if (previewImageFile != null) {
                          ZoomableImagePreview(
                              filePath = previewImageFile!!,
                              onClose = { previewImageFile = null },
                              onShare = { shareImageFile(context, previewImageFile!!) }
                          )
                      }

                      if (editingImageFile != null) {
                          CompleteImageEditorDialog(
                              inputFilePath = editingImageFile!!,
                              onClose = { editingImageFile = null },
                              onSaveEdited = { editedBmp ->
                                  val newFile = saveBitmapToFile(context, editedBmp, "edited_${System.currentTimeMillis()}.jpg")
                                  editingImageFile = null
                                  previewImageFile = newFile.absolutePath
                                  Toast.makeText(context, "এডিটেড ছবি সেভ হয়েছে!", Toast.LENGTH_SHORT).show()
                              }
                          )
                      }

                      if (isCallActive) {
                          CallOverlay(
                              caller = "করিম (কাজের ক্লায়েন্ট)",
                              onEnd = {
                                  ShaplaSoundEngine.stopCall(context)
                                  isCallActive = false
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun NavBarBtn(icon: ImageVector, label: String, isSel: Boolean, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clickable { onClick() }.padding(horizontal = 14.dp, vertical = 6.dp)
              ) {
                  Icon(icon, contentDescription = label, tint = if (isSel) ShaplaDeepGreen else Color.Gray, modifier = Modifier.size(24.dp))
                  Text(label, fontSize = 11.sp, color = if (isSel) ShaplaDeepGreen else Color.Gray, fontWeight = if (isSel) FontWeight.Bold else FontWeight.Normal)
              }
          }

          @Composable
          fun AdvancedVaultScreen(userName: String, onPreview: (String) -> Unit, onEditPhoto: (String) -> Unit) {
              val context = LocalContext.current
              var currentFolderId by remember { mutableStateOf<String?>(null) }
              var isTrashView by remember { mutableStateOf(false) }

              val folders = remember {
                  mutableStateListOf(
                      VaultFolder("f_nid", "জাতীয় পরিচয়পত্র (NID)"),
                      VaultFolder("f_pass", "পাসপোর্ট ও ভিসা"),
                      VaultFolder("f_land", "জমিজমা ও সম্পত্তি"),
                      VaultFolder("f_car", "গাড়ির কাগজপত্র")
                  )
              }

              val files = remember { mutableStateListOf<VaultFile>() }

              var showNewFolderDialog by remember { mutableStateOf(false) }
              var showNewFileDialog by remember { mutableStateOf(false) }

              BackHandler(enabled = currentFolderId != null || isTrashView) {
                  if (isTrashView) isTrashView = false else currentFolderId = null
              }

              val currentFolder = folders.find { it.id == currentFolderId }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          if (currentFolderId != null || isTrashView) {
                              IconButton(onClick = { if (isTrashView) isTrashView = false else currentFolderId = null }) {
                                  Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = ShaplaDeepGreen)
                              }
                          }
                          Text(
                              text = if (isTrashView) "রিসাইকেল বিন (Trash)" else (currentFolder?.name ?: "Secure Vault"),
                              fontWeight = FontWeight.Bold,
                              fontSize = 18.sp,
                              color = ShaplaDeepGreen
                          )
                      }

                      Row {
                          IconButton(onClick = { isTrashView = !isTrashView }) {
                              Icon(Icons.Default.Delete, contentDescription = "Trash", tint = if (isTrashView) Color.Red else Color.Gray)
                          }
                      }
                  }

                  if (!isTrashView) {
                      Surface(color = Color.White, shape = RoundedCornerShape(8.dp), modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp)) {
                          Row(modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text("Vault", color = ShaplaDeepGreen, fontWeight = FontWeight.Bold, modifier = Modifier.clickable { currentFolderId = null })
                              if (currentFolder != null) {
                                  Text("  ›  ", color = Color.Gray)
                                  Text(currentFolder.name, color = Color.DarkGray, fontWeight = FontWeight.SemiBold)
                              }
                          }
                      }

                      Row(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = Arrangement.End) {
                          OutlinedButton(onClick = { showNewFolderDialog = true }, modifier = Modifier.padding(end = 8.dp)) {
                              Icon(Icons.Default.Add, null, modifier = Modifier.size(16.dp))
                              Spacer(modifier = Modifier.width(4.dp))
                              Text("ফোল্ডার", fontSize = 12.sp)
                          }
                          Button(onClick = { showNewFileDialog = true }, colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen)) {
                              Icon(Icons.Default.Add, null, modifier = Modifier.size(16.dp))
                              Spacer(modifier = Modifier.width(4.dp))
                              Text("ফাইল/নথি", fontSize = 12.sp)
                          }
                      }
                  }

                  LazyColumn(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      if (!isTrashView) {
                          val visibleFolders = folders.filter { it.parentId == currentFolderId && !it.isTrash }
                          items(visibleFolders) { f ->
                              Card(modifier = Modifier.fillMaxWidth().clickable { currentFolderId = f.id }, colors = CardDefaults.cardColors(containerColor = Color.White)) {
                                  Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Icon(Icons.Default.Star, null, tint = ShaplaAmber, modifier = Modifier.size(28.dp))
                                      Spacer(modifier = Modifier.width(12.dp))
                                      Text(f.name, fontWeight = FontWeight.SemiBold, modifier = Modifier.weight(1f))
                                      IconButton(onClick = {
                                          val idx = folders.indexOf(f)
                                          if (idx != -1) folders[idx] = f.copy(isTrash = true)
                                          Toast.makeText(context, "ফোল্ডার ট্র্যাশে পাঠানো হয়েছে", Toast.LENGTH_SHORT).show()
                                      }) { Icon(Icons.Default.Delete, null, tint = Color.LightGray, modifier = Modifier.size(18.dp)) }
                                  }
                              }
                          }

                          val visibleFiles = files.filter { it.folderId == currentFolderId && !it.isTrash }
                          items(visibleFiles) { fileItem ->
                              Card(modifier = Modifier.fillMaxWidth().clickable { onPreview(fileItem.imagePath) }, colors = CardDefaults.cardColors(containerColor = Color.White)) {
                                  Row(modifier = Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Icon(Icons.Default.Lock, null, tint = ShaplaLeafGreen, modifier = Modifier.size(26.dp))
                                      Spacer(modifier = Modifier.width(10.dp))
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(fileItem.title, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                          Text("নম্বর: ${fileItem.idNumber}", fontSize = 12.sp, color = Color.Gray)
                                      }
                                      IconButton(onClick = { onEditPhoto(fileItem.imagePath) }) { Icon(Icons.Default.Edit, "Edit", tint = ShaplaDeepGreen) }
                                      IconButton(onClick = { shareImageFile(context, fileItem.imagePath) }) { Icon(Icons.Default.Share, "Share", tint = Color.DarkGray) }
                                      IconButton(onClick = {
                                          val idx = files.indexOf(fileItem)
                                          if (idx != -1) files[idx] = fileItem.copy(isTrash = true)
                                          Toast.makeText(context, "নথি ট্র্যাশে পাঠানো হয়েছে", Toast.LENGTH_SHORT).show()
                                      }) { Icon(Icons.Default.Delete, null, tint = Color.Red.copy(alpha = 0.6f)) }
                                  }
                              }
                          }
                      } else {
                          item {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("ট্র্যাশের আইটেমসমূহ", fontWeight = FontWeight.Bold, color = Color.Red)
                                  TextButton(onClick = {
                                      folders.removeAll { it.isTrash }
                                      files.removeAll { it.isTrash }
                                      Toast.makeText(context, "ট্র্যাশ পরিষ্কার করা হয়েছে!", Toast.LENGTH_SHORT).show()
                                  }) { Text("Empty Trash", color = Color.Red) }
                              }
                          }

                          val trashedFiles = files.filter { it.isTrash }
                          items(trashedFiles) { tf ->
                              Card(colors = CardDefaults.cardColors(containerColor = Color(0xFFFFEBEE))) {
                                  Row(modifier = Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Text(tf.title, modifier = Modifier.weight(1f))
                                      Button(
                                          onClick = {
                                              val idx = files.indexOf(tf)
                                              if (idx != -1) files[idx] = tf.copy(isTrash = false)
                                              Toast.makeText(context, "পুনরুদ্ধার সম্পন্ন!", Toast.LENGTH_SHORT).show()
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen)
                                      ) { Text("Restore") }
                                  }
                              }
                          }
                      }
                  }
              }

              if (showNewFolderDialog) {
                  var folderName by remember { mutableStateOf("") }
                  AlertDialog(
                      onDismissRequest = { showNewFolderDialog = false },
                      title = { Text("নতুন ফোল্ডার") },
                      text = { OutlinedTextField(value = folderName, onValueChange = { folderName = it }, label = { Text("ফোল্ডারের নাম") }) },
                      confirmButton = {
                          Button(onClick = {
                              if (folderName.isNotBlank()) {
                                  folders.add(VaultFolder(UUID.randomUUID().toString(), folderName, currentFolderId))
                                  showNewFolderDialog = false
                              }
                          }) { Text("তৈরি করুন") }
                      },
                      dismissButton = { TextButton(onClick = { showNewFolderDialog = false }) { Text("বাতিল") } }
                  )
              }

              if (showNewFileDialog) {
                  var title by remember { mutableStateOf("") }
                  var num by remember { mutableStateOf("") }
                  var selBmp by remember { mutableStateOf<Bitmap?>(null) }

                  val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                      if (uri != null) {
                          context.contentResolver.openInputStream(uri)?.use { selBmp = BitmapFactory.decodeStream(it) }
                      }
                  }

                  Dialog(onDismissRequest = { showNewFileDialog = false }) {
                      Card(shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color.White), modifier = Modifier.fillMaxWidth().padding(14.dp)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("নতুন নথি যুক্ত করুন", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = ShaplaDeepGreen)
                              OutlinedTextField(value = title, onValueChange = { title = it }, label = { Text("নথির নাম") }, modifier = Modifier.fillMaxWidth())
                              OutlinedTextField(value = num, onValueChange = { num = it }, label = { Text("আইডি/নম্বর") }, modifier = Modifier.fillMaxWidth())

                              if (selBmp != null) {
                                  Image(bitmap = selBmp!!.asImageBitmap(), contentDescription = null, modifier = Modifier.fillMaxWidth().height(140.dp).clip(RoundedCornerShape(8.dp)), contentScale = ContentScale.Crop)
                              } else {
                                  Button(onClick = { picker.launch("image/*") }, modifier = Modifier.fillMaxWidth()) { Text("গ্যালারি থেকে ছবি নিন") }
                              }

                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedButton(onClick = { showNewFileDialog = false }, modifier = Modifier.weight(1f)) { Text("বাতিল") }
                                  Button(
                                      onClick = {
                                          if (title.isNotBlank() && selBmp != null) {
                                              val file = saveBitmapToFile(context, selBmp!, "file_${System.currentTimeMillis()}.jpg")
                                              files.add(VaultFile(UUID.randomUUID().toString(), currentFolderId, title, num, file.absolutePath))
                                              showNewFileDialog = false
                                          }
                                      },
                                      modifier = Modifier.weight(1f),
                                      colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen)
                                  ) { Text("সেভ করুন") }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CompleteImageEditorDialog(inputFilePath: String, onClose: () -> Unit, onSaveEdited: (Bitmap) -> Unit) {
              val originalBmp = remember(inputFilePath) { BitmapFactory.decodeFile(inputFilePath) }
              var currentBmp by remember { mutableStateOf(originalBmp) }
              var activeFilter by remember { mutableStateOf("original") }

              Dialog(onDismissRequest = onClose, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Surface(modifier = Modifier.fillMaxSize(), color = Color.Black) {
                      Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = onClose) { Icon(Icons.Default.Close, null, tint = Color.White) }
                              Text("ফটো এডিটর", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                              Button(
                                  onClick = { currentBmp?.let { onSaveEdited(it) } },
                                  colors = ButtonDefaults.buttonColors(containerColor = ShaplaLeafGreen)
                              ) { Text("Save") }
                          }

                          Box(modifier = Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                              if (currentBmp != null) {
                                  Image(bitmap = currentBmp!!.asImageBitmap(), contentDescription = "Editor Target", modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Fit)
                              }
                          }

                          Column(modifier = Modifier.fillMaxWidth().background(Color(0xFF1E293B), RoundedCornerShape(12.dp)).padding(10.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceAround) {
                                  IconButton(onClick = { currentBmp?.let { currentBmp = ImageEditUtils.rotate(it, 90f) } }) {
                                      Icon(Icons.Default.Refresh, "Rotate", tint = Color.White)
                                  }
                                  TextButton(onClick = { currentBmp?.let { currentBmp = ImageEditUtils.cropSquare(it) } }) {
                                      Text("1:1 Crop", color = Color.White, fontWeight = FontWeight.Bold)
                                  }
                              }

                              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(top = 8.dp)) {
                                  val filters = listOf("original" to "Normal", "grayscale" to "B&W", "sepia" to "Sepia", "warm" to "Warm")
                                  items(filters) { (key, label) ->
                                      Button(
                                          onClick = {
                                              activeFilter = key
                                              originalBmp?.let { currentBmp = if (key == "original") it else ImageEditUtils.applyFilter(it, key) }
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = if (activeFilter == key) ShaplaLeafGreen else Color.DarkGray)
                                      ) { Text(label, fontSize = 11.sp) }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ZoomableImagePreview(filePath: String, onClose: () -> Unit, onShare: () -> Unit) {
              val bmp = remember(filePath) { BitmapFactory.decodeFile(filePath) }
              Dialog(onDismissRequest = onClose, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                      if (bmp != null) {
                          Image(
                              bitmap = bmp.asImageBitmap(),
                              contentDescription = "Preview",
                              modifier = Modifier.fillMaxSize(),
                              contentScale = ContentScale.Fit
                          )
                      }
                      Row(
                          modifier = Modifier.fillMaxWidth().statusBarsPadding().padding(14.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onClose) { Icon(Icons.Default.Close, null, tint = Color.White) }
                          IconButton(onClick = onShare) { Icon(Icons.Default.Share, null, tint = Color.White) }
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(userName: String, onCallTest: () -> Unit) {
              val context = LocalContext.current
              val posts = remember {
                  mutableStateListOf(
                      PostItem("1", "Mohammad Israfil Hossain", "৫ মিনিট আগে", "শাপলা (Shapla) অ্যাপে সবাইকে স্বাগতম! কাজ, সেবা ও মানুষের যোগাযোগ—সব একসাথে।"),
                      PostItem("2", "আরিফুল ইসলাম", "১ ঘণ্টা আগে", "ঢাকা উত্তরা ও মিরপুরে ইলেকট্রিক সার্ভিসিং কাজের জন্য যোগাযোগ করুন।")
                  )
              }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(12.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  item {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("Shapla Feed", fontWeight = FontWeight.ExtraBold, fontSize = 20.sp, color = ShaplaDeepGreen)
                          Row {
                              IconButton(onClick = onCallTest) { Icon(Icons.Default.Phone, null, tint = ShaplaAmber) }
                              IconButton(onClick = { ShaplaSoundEngine.playTriplePing(context) }) { Icon(Icons.Default.Notifications, null, tint = ShaplaDeepGreen) }
                          }
                      }
                  }

                  items(posts) { p ->
                      Card(colors = CardDefaults.cardColors(containerColor = Color.White), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text(p.authorName, fontWeight = FontWeight.Bold, color = ShaplaDeepGreen)
                              Text(p.timeAgo, fontSize = 11.sp, color = Color.Gray)
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(p.content)
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                                  Row(modifier = Modifier.clickable {
                                      p.isLiked = !p.isLiked
                                      p.likes += if (p.isLiked) 1 else -1
                                      if (p.isLiked) ShaplaSoundEngine.playTriplePing(context)
                                  }) {
                                      Icon(Icons.Default.ThumbUp, null, tint = if (p.isLiked) ShaplaLeafGreen else Color.Gray, modifier = Modifier.size(16.dp))
                                      Spacer(modifier = Modifier.width(4.dp))
                                      Text("${p.likes}", fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun JobScreen() {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("কাজ ও সেবা (Job & Work)", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = ShaplaDeepGreen)
                  Spacer(modifier = Modifier.height(10.dp))
                  Card(colors = CardDefaults.cardColors(containerColor = Color.White), modifier = Modifier.fillMaxWidth()) {
