                  Spacer(modifier = Modifier.height(10.dp))
                  OutlinedTextField(value = phone, onValueChange = { phone = it }, label = { Text("মোবাইল নম্বর") }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(10.dp))
                  OutlinedTextField(value = pwd, onValueChange = { pwd = it }, label = { Text("পাসওয়ার্ড (৬+ সংখ্যা)") }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp))
                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (phone.isNotBlank() && pwd.length >= 6) {
                              prefs.edit().putString("pwd_$phone", hashPwd(pwd)).putString("name_$phone", name).apply()
                              onSuccess(phone)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = ShaplaDeepGreen),
                      shape = RoundedCornerShape(12.dp)
                  ) { Text("নিবন্ধন সম্পন্ন করুন", fontWeight = FontWeight.Bold) }
                  Spacer(modifier = Modifier.height(12.dp))
                  TextButton(onClick = onGoLogin) { Text("লগইন পেজে ফিরুন", color = ShaplaDeepGreen) }
              }
          }

          @Composable
          fun MainAppHub(userName: String, userPrefs: android.content.SharedPreferences, onLogout: () -> Unit) {
              val context = LocalContext.current
              var activeTab by remember { mutableStateOf("home") }
              var lastBackPressTime by remember { mutableStateOf(0L) }

              var previewImageFile by remember { mutableStateOf<String?>(null) }
              var editingImageFile by remember { mutableStateOf<String?>(null) }
              var isIncomingCallActive by remember { mutableStateOf(false) }

              BackHandler(enabled = true) {
                  when {
                      editingImageFile != null -> editingImageFile = null
                      previewImageFile != null -> previewImageFile = null
                      activeTab != "home" -> activeTab = "home"
                      else -> {
                          val now = System.currentTimeMillis()
                          if (now - lastBackPressTime < 2000) {
                              (context as? ComponentActivity)?.finish()
                          } else {
                              lastBackPressTime = now
                              Toast.makeText(context, "অ্যাপ থেকে বের হতে আবার চাপুন", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              Scaffold(
                  bottomBar = {
                      Surface(color = Color.White, shadowElevation = 8.dp, modifier = Modifier.fillMaxWidth()) {
                          Row(
                              modifier = Modifier.fillMaxWidth().navigationBarsPadding().padding(vertical = 4.dp),
                              horizontalArrangement = Arrangement.SpaceAround,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              NavBarBtn(icon = Icons.Default.Home, label = "Home", isSel = activeTab == "home") { activeTab = "home" }
                              NavBarBtn(icon = Icons.Default.Lock, label = "Vault", isSel = activeTab == "vault") { activeTab = "vault" }
                              NavBarBtn(icon = Icons.Default.Star, label = "Job", isSel = activeTab == "job") { activeTab = "job" }
                              NavBarBtn(icon = Icons.Default.Settings, label = "Settings", isSel = activeTab == "settings") { activeTab = "settings" }
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.fillMaxSize().padding(padding).background(ShaplaBg)) {
                      when (activeTab) {
                          "home" -> HomeScreen(
                              userName = userName,
                              onTriggerCall = {
                                  isIncomingCallActive = true
                                  ShaplaSoundEngine.start40sCallRingtone(context) { isIncomingCallActive = false }
                              },
                              onPreview = { previewImageFile = it }
                          )
                          "vault" -> AdvancedVaultScreen(
                              userName = userName,
                              onPreview = { previewImageFile = it },
                              onEditPhoto = { editingImageFile = it }
                          )
                          "job" -> JobScreen()
                          "settings" -> SettingsScreen(userName = userName, onLogout = onLogout)
                      }

                      if (previewImageFile != null) {
                          ZoomableImagePreview(
                              filePath = previewImageFile!!,
                              onClose = { previewImageFile = null },
                              onShare = { shareImageFile(context, previewImageFile!!) }
                          )
                      }

                      if (editingImageFile != null) {
                          CompleteImageEditorDialog(
                              inputFilePath = editingImageFile!!,
                              onClose = { editingImageFile = null },
                              onSaveEdited = { editedBmp ->
                                  val newFile = saveBitmapToFile(context, editedBmp, "edited_${System.currentTimeMillis()}.jpg")
                                  editingImageFile = null
                                  previewImageFile = newFile.absolutePath
                                  Toast.makeText(context, "এডিটেড ছবি সফলভাবে সেভ হয়েছে!", Toast.LENGTH_SHORT).show()
                              }
                          )
                      }

                      if (isIncomingCallActive) {
                          CallOverlay(
                              caller = "করিম (কাজের ক্লায়েন্ট)",
                              onEnd = {
                                  ShaplaSoundEngine.stopCallRingtone(context)
                                  isIncomingCallActive = false
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun NavBarBtn(icon: ImageVector, label: String, isSel: Boolean, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clickable { onClick() }.padding(horizontal = 14.dp, vertical = 6.dp)
              ) {
                  Icon(icon, contentDescription = label, tint = if (isSel) ShaplaDeepGreen else Color.Gray, modifier = Modifier.size(24.dp))
                  Text(label, fontSize = 11.sp, color = if (isSel) ShaplaDeepGreen else Color.Gray, fontWeight = if (isSel) FontWeight.Bold else FontWeight.Normal)
              }
          }

