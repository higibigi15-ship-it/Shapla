                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(userName: String, onLogout: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("সেটিংস", fontWeight = FontWeight.Bold, fontSize = 20.sp, color = ShaplaDeepGreen)
                  Text("লগইন আইডি: $userName", color = Color.DarkGray)
                  Text("Designed & Owned by Mohammad Israfil Hossain", fontSize = 11.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(20.dp))
