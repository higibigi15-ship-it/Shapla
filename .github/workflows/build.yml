name: Build Shapla APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: চেকআউট রিপোজিটরি
        uses: actions/checkout@v4

      - name: জাভা (JDK 17) সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: গ্র্যাডল সেটআপ
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: অ্যান্ড্রয়েড প্রজেক্টের ফাইলসমূহ তৈরি করা হচ্ছে
        run: |
          mkdir -p app/src/main/java/com/shapla/app

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Shapla"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.shapla.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.shapla.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.1.0"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="শাপলা"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/shapla/app/MainActivity.kt
          package com.shapla.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.AudioAttributes
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.os.VibrationEffect
          import android.os.Vibrator
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.core.app.NotificationCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest

          val BrandGreen = Color(0xFF0B4636)
          val BrandLeaf = Color(0xFF10B981)
          val DarkBg = Color(0xFF071B16)
          val OrangeCall = Color(0xFFEA580C)

          // ১. নোটিফিকেশন ও পিং/কল সাউন্ড হেল্পার
          object NotificationService {
              private const val CHANNEL_MSG = "shapla_messages"
              private const val CHANNEL_CALL = "shapla_calls"
              var activeRingtone: Ringtone? = null
              var callTimer: CountDownTimer? = null

              fun initChannels(context: Context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                      // মেসেজের জন্য পিং চ্যানেল
                      val msgChannel = NotificationChannel(
                          CHANNEL_MSG,
                          "মেসেজ নোটিফিকেশন",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "শাপলা মেসেজের জন্য পিং শব্দ"
                          enableVibration(true)
                      }

                      // কলের জন্য চ্যানেল
                      val callChannel = NotificationChannel(
                          CHANNEL_CALL,
                          "ইনকামিং কল নোটিফিকেশন",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "শাপলা অডিও ও ভিডিও কল"
                          setSound(
                              RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE),
                              AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).build()
                          )
                          enableVibration(true)
                      }

                      nm.createNotificationChannel(msgChannel)
                      nm.createNotificationChannel(callChannel)
                  }
              }

              // মেসেজ আসলে "পিং" শব্দ বাজানো ও নোটিফিকেশন দেওয়া
              fun triggerMessagePing(context: Context, sender: String, text: String) {
                  val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  val ringtone = RingtoneManager.getRingtone(context, soundUri)
                  ringtone?.play()

                  val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator?.vibrate(VibrationEffect.createOneShot(150, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      vibrator?.vibrate(150)
                  }

                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val notif = NotificationCompat.Builder(context, CHANNEL_MSG)
                      .setSmallIcon(android.R.drawable.stat_notify_chat)
                      .setContentTitle("শাপলা বার্তা: $sender")
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(System.currentTimeMillis().toInt(), notif)
              }

              // কল আসলে অবিরাম পিংপিং রিংটোন বাজবে প্রায় ৪০ সেকেন্ড
              fun startIncomingCallRingtone(context: Context, onTimeout: () -> Unit) {
                  stopCallRingtone()
                  try {
                      val callUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      activeRingtone = RingtoneManager.getRingtone(context, callUri)
                      activeRingtone?.play()

                      val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      val pattern = longArrayOf(0, 1000, 1000)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createWaveform(pattern, 0))
                      } else {
                          vibrator?.vibrate(pattern, 0)
                      }

                      // ঠিক ৪০ সেকেন্ড টাইমার
                      callTimer = object : CountDownTimer(40000, 1000) {
                          override fun onTick(millisUntilFinished: Long) {
                              if (activeRingtone?.isPlaying == false) {
                                  activeRingtone?.play()
                              }
                          }
                          override fun onFinish() {
                              stopCallRingtone(context)
                              onTimeout()
                          }
                      }.start()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun stopCallRingtone(context: Context? = null) {
                  try {
                      callTimer?.cancel()
                      callTimer = null
                      activeRingtone?.stop()
                      activeRingtone = null
                      context?.let {
                          val vibrator = it.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          vibrator?.cancel()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }

          fun hashPwd(password: String): String {
              val digest = MessageDigest.getInstance("SHA-256")
              val bytes = digest.digest(password.toByteArray(Charsets.UTF_8))
              return bytes.joinToString("") { "%02x".format(it) }
          }

          fun saveBitmapToStorage(context: Context, bitmap: Bitmap, fileName: String): String {
              val dir = File(context.filesDir, "vault_photos")
              if (!dir.exists()) dir.mkdirs()
              val file = File(dir, fileName)
              FileOutputStream(file).use { out ->
                  bitmap.compress(Bitmap.CompressFormat.JPEG, 90, out)
              }
              return file.absolutePath
          }

          fun loadBitmapFromPath(path: String?): Bitmap? {
              if (path.isNullOrBlank()) return null
              val file = File(path)
              return if (file.exists()) BitmapFactory.decodeFile(file.absolutePath) else null
          }

          fun rotateBitmap(source: Bitmap, angle: Float): Bitmap {
              val matrix = Matrix()
              matrix.postRotate(angle)
              return Bitmap.createBitmap(source, 0, 0, source.width, source.height, matrix, true)
          }

          fun cropToSquare(source: Bitmap): Bitmap {
              val size = minOf(source.width, source.height)
              val x = (source.width - size) / 2
              val y = (source.height - size) / 2
              return Bitmap.createBitmap(source, x, y, size, size)
          }

          data class RecordItem(
              val id: String,
              val title: String,
              val idNumber: String,
              val imagePath: String? = null
          )

          fun loadSavedRecords(context: Context, userName: String, catName: String): MutableList<RecordItem> {
              val prefs = context.getSharedPreferences("shapla_vault_db", Context.MODE_PRIVATE)
              val raw = prefs.getString("vault_${userName}_$catName", "[]") ?: "[]"
              val list = mutableListOf<RecordItem>()
              try {
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      list.add(
                          RecordItem(
                              id = obj.optString("id"),
                              title = obj.optString("title"),
                              idNumber = obj.optString("idNumber"),
                              imagePath = if (obj.has("imagePath")) obj.optString("imagePath") else null
                          )
                      )
                  }
              } catch (e: Exception) {
                  e.printStackTrace()
              }
              return list
          }

          fun saveRecordsPermanently(context: Context, userName: String, catName: String, items: List<RecordItem>) {
              val prefs = context.getSharedPreferences("shapla_vault_db", Context.MODE_PRIVATE)
              val arr = JSONArray()
              for (item in items) {
                  val obj = JSONObject()
                  obj.put("id", item.id)
                  obj.put("title", item.title)
                  obj.put("idNumber", item.idNumber)
                  obj.put("imagePath", item.imagePath ?: "")
                  arr.put(obj)
              }
              prefs.edit().putString("vault_${userName}_$catName", arr.toString()).apply()
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  NotificationService.initChannels(this)
                  val prefs = getSharedPreferences("shapla_users", Context.MODE_PRIVATE)

                  setContent {
                      var currentScreen by remember { mutableStateOf("login") }
                      var currentLoggedInUser by remember { mutableStateOf("") }

                      when (currentScreen) {
                          "login" -> LoginScreen(
                              prefs = prefs,
                              onNavigateToRegister = { currentScreen = "register" },
                              onLoginSuccess = { user ->
                                  currentLoggedInUser = user
                                  currentScreen = "vault"
                              }
                          )
                          "register" -> RegisterScreen(
                              prefs = prefs,
                              onNavigateToLogin = { currentScreen = "login" },
                              onRegisterSuccess = { user ->
                                  currentLoggedInUser = user
                                  currentScreen = "vault"
                              }
                          )
                          "vault" -> SecureVaultScreen(
                              userName = currentLoggedInUser,
                              userPrefs = prefs,
                              onLogout = {
                                  currentLoggedInUser = ""
                                  currentScreen = "login"
                              }
                          )
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  NotificationService.stopCallRingtone(this)
              }
          }

          @Composable
          fun LoginScreen(
              prefs: android.content.SharedPreferences,
              onNavigateToRegister: () -> Unit,
              onLoginSuccess: (String) -> Unit
          ) {
              var identifier by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var errorMsg by remember { mutableStateOf<String?>(null) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFFF8FAFC))
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("শাপলা (Shapla)", fontSize = 32.sp, fontWeight = FontWeight.Bold, color = BrandGreen)
                  Text("কাজ, সেবা, সব একসাথে।", fontSize = 14.sp, color = BrandLeaf, fontWeight = FontWeight.Medium)
                  Text("Designed & Owned by Mohammad Israfil Hossain", fontSize = 11.sp, color = Color.Gray, modifier = Modifier.padding(top = 4.dp))
                  Text("Made by Israfil Hossain", fontSize = 11.sp, color = Color.LightGray)

                  Spacer(modifier = Modifier.height(28.dp))

                  if (errorMsg != null) {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFEBEE)),
                          modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)
                      ) {
                          Text(errorMsg!!, color = Color(0xFFC62828), fontSize = 13.sp, modifier = Modifier.padding(12.dp))
                      }
                  }

                  OutlinedTextField(
                      value = identifier,
                      onValueChange = { identifier = it.trim() },
                      label = { Text("মোবাইল নাম্বার বা ইউজারনেম") },
                      leadingIcon = { Icon(Icons.Default.Phone, null) },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(12.dp))

                  OutlinedTextField(
                      value = password,
                      onValueChange = { password = it },
                      label = { Text("গোপন পাসওয়ার্ড") },
                      leadingIcon = { Icon(Icons.Default.Lock, null) },
                      visualTransformation = PasswordVisualTransformation(),
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (identifier.isBlank() || password.isBlank()) {
                              errorMsg = "সব তথ্য সঠিকভাবে দিন।"
                          } else {
                              val savedHash = prefs.getString("pwd_$identifier", null)
                              if (savedHash == null) {
                                  errorMsg = "এই মোবাইল নাম্বারে কোনো অ্যাকাউন্ট নেই!"
                              } else {
                                  val inputHash = hashPwd(password)
                                  if (inputHash != savedHash) {
                                      errorMsg = "ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।"
                                  } else {
                                      errorMsg = null
                                      onLoginSuccess(identifier)
                                  }
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = BrandGreen)
                  ) {
                      Text("লগইন করুন (Log In)", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  TextButton(onClick = onNavigateToRegister) {
                      Text("নতুন অ্যাকাউন্ট খুলুন (Register)", color = BrandLeaf, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun RegisterScreen(
              prefs: android.content.SharedPreferences,
              onNavigateToLogin: () -> Unit,
              onRegisterSuccess: (String) -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var confirmPwd by remember { mutableStateOf("") }
              var errorMsg by remember { mutableStateOf<String?>(null) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFFF8FAFC))
                      .verticalScroll(rememberScrollState())
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("শাপলা (Shapla)", fontSize = 28.sp, fontWeight = FontWeight.Bold, color = BrandGreen)
                  Text("নতুন আইডি তৈরি করুন", fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                  Text("Made by Israfil Hossain", fontSize = 11.sp, color = Color.Gray)

                  Spacer(modifier = Modifier.height(20.dp))

                  if (errorMsg != null) {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFEBEE)),
                          modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)
                      ) {
                          Text(errorMsg!!, color = Color(0xFFC62828), fontSize = 13.sp, modifier = Modifier.padding(12.dp))
                      }
                  }

                  OutlinedTextField(
                      value = name,
                      onValueChange = { name = it },
                      label = { Text("পুরো নাম (Full Name)") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = phone,
                      onValueChange = { phone = it.filter { c -> c.isDigit() } },
                      label = { Text("মোবাইল নাম্বার (ইউনিক হতে হবে)") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = password,
                      onValueChange = { password = it },
                      label = { Text("পাসওয়ার্ড (কমপক্ষে ৬ সংখ্যার)") },
                      visualTransformation = PasswordVisualTransformation(),
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = confirmPwd,
                      onValueChange = { confirmPwd = it },
                      label = { Text("পাসওয়ার্ড নিশ্চিত করুন") },
                      visualTransformation = PasswordVisualTransformation(),
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (name.isBlank() || phone.isBlank() || password.isBlank()) {
                              errorMsg = "সবগুলো ঘর পূরণ করুন।"
                          } else if (password.length < 6) {
                              errorMsg = "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।"
                          } else if (password != confirmPwd) {
                              errorMsg = "উভয় পাসওয়ার্ড একই হতে হবে।"
                          } else if (prefs.contains("pwd_$phone")) {
                              errorMsg = "এই নাম্বারে ইতিমধ্যে আইডি খোলা আছে!"
                          } else {
                              prefs.edit()
                                  .putString("pwd_$phone", hashPwd(password))
                                  .putString("name_$phone", name)
                                  .apply()
                              errorMsg = null
                              onRegisterSuccess(phone)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = BrandGreen)
                  ) {
                      Text("নিবন্ধন সম্পন্ন করুন (Sign Up)", fontWeight = FontWeight.Bold)
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  TextButton(onClick = onNavigateToLogin) {
                      Text("লগইন পেজে যান", color = BrandGreen)
                  }
              }
          }

          enum class VaultCat(val titleBn: String, val icon: ImageVector) {
              NID("জাতীয় পরিচয়পত্র (NID)", Icons.Default.Person),
              PASSPORT("পাসপোর্ট ও ভিসা", Icons.Default.Star),
              LAND("জমি ও সম্পত্তির দলিল", Icons.Default.Home),
              VEHICLE("গাড়ির কাগজপত্র", Icons.Default.Info),
              BANK("ব্যাংক ও আর্থিক নথি", Icons.Default.Lock),
              CONTACTS("জরুরি যোগাযোগ", Icons.Default.Phone),
              NOTES("নোট ও রিমাইন্ডার", Icons.Default.Edit)
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SecureVaultScreen(
              userName: String,
              userPrefs: android.content.SharedPreferences,
              onLogout: () -> Unit
          ) {
              val context = LocalContext.current
              var selectedCat by remember { mutableStateOf<VaultCat?>(null) }
              val records = remember { mutableStateListOf<RecordItem>() }
              var showAddDialog by remember { mutableStateOf(false) }

              // প্রোফাইল এডিটর স্টেট
              var showProfileDialog by remember { mutableStateOf(false) }
              var profilePhotoPath by remember {
                  mutableStateOf(userPrefs.getString("profile_pic_$userName", null))
              }
              val profileBitmap = remember(profilePhotoPath) { loadBitmapFromPath(profilePhotoPath) }

              // পুরো ছবি দেখার ভিউয়ার
              var previewImagePath by remember { mutableStateOf<String?>(null) }

              // ইনকামিং কল স্টেট (৪০ সেকেন্ড রিংটোন স্ক্রিন)
              var incomingCallName by remember { mutableStateOf<String?>(null) }
              var callRemainingSeconds by remember { mutableStateOf(40) }

              LaunchedEffect(selectedCat) {
                  records.clear()
                  if (selectedCat != null) {
                      records.addAll(loadSavedRecords(context, userName, selectedCat!!.name))
                  }
              }

              Scaffold(
                  topBar = {
                      Surface(
                          modifier = Modifier.fillMaxWidth(),
                          color = BrandGreen,
                          shadowElevation = 6.dp
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .statusBarsPadding()
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  if (selectedCat != null) {
                                      IconButton(onClick = { selectedCat = null }) {
                                          Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                                      }
                                      Spacer(modifier = Modifier.width(4.dp))
                                  }
                                  Column {
                                      Text(
                                          text = if (selectedCat == null) "শাপলা (Shapla) ভল্ট" else selectedCat!!.titleBn,
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 18.sp,
                                          color = Color.White
                                      )
                                      Text(
                                          text = "Made by Israfil Hossain",
                                          fontSize = 11.sp,
                                          color = Color(0xFFD1FAE5)
                                      )
                                  }
                              }

                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color.White.copy(alpha = 0.2f))
                                          .border(1.5.dp, BrandLeaf, CircleShape)
                                          .clickable { showProfileDialog = true },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      if (profileBitmap != null) {
                                          Image(
                                              bitmap = profileBitmap.asImageBitmap(),
                                              contentDescription = "Profile",
                                              modifier = Modifier.fillMaxSize(),
                                              contentScale = ContentScale.Crop
                                          )
                                      } else {
                                          Icon(
                                              Icons.Default.Person,
                                              contentDescription = "Profile",
                                              tint = Color.White,
                                              modifier = Modifier.size(24.dp)
                                          )
                                      }
                                  }

                                  IconButton(onClick = onLogout) {
                                      Icon(Icons.Default.ExitToApp, contentDescription = "Logout", tint = Color.White)
                                  }
                              }
                          }
                      }
                  },
                  floatingActionButton = {
                      if (selectedCat != null) {
                          ExtendedFloatingActionButton(
                              onClick = { showAddDialog = true },
                              containerColor = BrandLeaf,
                              contentColor = Color.White,
                              icon = { Icon(Icons.Default.Add, null) },
                              text = { Text("+ নথিপত্র যোগ করুন (Add)") }
                          )
                      }
                  }
              ) { p ->
                  Box(modifier = Modifier.fillMaxSize().padding(p).background(Color(0xFFF8FAFC))) {
                      Column(modifier = Modifier.fillMaxSize()) {
                          // নোটিফিকেশন ও কল টেস্ট বার
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0F2D25)),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      "সাউন্ড ও কল টেস্ট:",
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.SemiBold
                                  )
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      // মেসেজ পিং বাটন
                                      Button(
                                          onClick = {
                                              NotificationService.triggerMessagePing(
                                                  context,
                                                  "রহিম কার্পেন্টার",
                                                  "ভাই, কাজের আপডেট পাঠিয়েছি। দেখে নিন।"
                                              )
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 4.dp)
                                      ) {
                                          Icon(Icons.Default.Notifications, null, modifier = Modifier.size(14.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("মেসেজ পিং", fontSize = 11.sp)
                                      }

                                      // ৪০ সেকেন্ড কল রিং বাটন
                                      Button(
                                          onClick = {
                                              incomingCallName = "করিম ইলেকট্রিশিয়ান"
                                              callRemainingSeconds = 40
                                              NotificationService.startIncomingCallRingtone(context) {
                                                  incomingCallName = null
                                              }
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = OrangeCall),
                                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 4.dp)
                                      ) {
                                          Icon(Icons.Default.Phone, null, modifier = Modifier.size(14.dp))
                                          Spacer(modifier = Modifier.width(4.dp))
                                          Text("৪০ সে. কল টেস্ট", fontSize = 11.sp)
                                      }
                                  }
                              }
                          }

                          if (selectedCat == null) {
                              LazyColumn(contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  items(VaultCat.values()) { cat ->
                                      val count = loadSavedRecords(context, userName, cat.name).size
                                      Card(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .shadow(2.dp, RoundedCornerShape(12.dp))
                                              .clickable { selectedCat = cat },
                                          shape = RoundedCornerShape(12.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color.White)
                                      ) {
                                          Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                                              Box(
                                                  modifier = Modifier
                                                      .size(46.dp)
                                                      .background(BrandGreen.copy(alpha = 0.08f), RoundedCornerShape(10.dp)),
                                                  contentAlignment = Alignment.Center
                                              ) {
                                                  Icon(cat.icon, null, tint = BrandGreen, modifier = Modifier.size(26.dp))
                                              }
                                              Spacer(modifier = Modifier.width(16.dp))
                                              Column(modifier = Modifier.weight(1f)) {
                                                  Text(cat.titleBn, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                                  Text(
                                                      if (count > 0) "$count টি নথি সংরক্ষিত" else "কোনো নথি নেই",
                                                      fontSize = 12.sp,
                                                      color = if (count > 0) BrandLeaf else Color.Gray,
                                                      fontWeight = FontWeight.Medium
                                                  )
                                              }
                                              Text("›", fontSize = 24.sp, color = Color.LightGray)
                                          }
                                      }
                                  }
                              }
                          } else {
                              if (records.isEmpty()) {
                                  Column(
                                      modifier = Modifier.fillMaxSize().padding(32.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      Icon(selectedCat!!.icon, null, modifier = Modifier.size(64.dp), tint = Color.LightGray)
                                      Spacer(modifier = Modifier.height(16.dp))
                                      Text("এই ফোল্ডারে কোনো নথি নেই", fontWeight = FontWeight.Bold, color = Color.Gray)
                                      Spacer(modifier = Modifier.height(16.dp))
                                      Button(
                                          onClick = { showAddDialog = true },
                                          colors = ButtonDefaults.buttonColors(containerColor = BrandGreen)
                                      ) {
                                          Icon(Icons.Default.Add, null)
                                          Spacer(modifier = Modifier.width(6.dp))
                                          Text("+ নথি বা ছবি যোগ করুন")
                                      }
                                  }
                              } else {
                                  LazyColumn(contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                      items(records) { item ->
                                          val itemBitmap = remember(item.imagePath) { loadBitmapFromPath(item.imagePath) }
                                          Card(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .shadow(2.dp, RoundedCornerShape(12.dp))
                                              .clickable {
                                                  if (!item.imagePath.isNullOrBlank()) {
                                                      previewImagePath = item.imagePath
                                                  }
                                              },
                                              shape = RoundedCornerShape(12.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color.White)
                                          ) {
                                              Row(
                                                  modifier = Modifier.padding(14.dp),
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  if (itemBitmap != null) {
                                                      Image(
                                                          bitmap = itemBitmap.asImageBitmap(),
                                                          contentDescription = "Photo",
                                                          modifier = Modifier
                                                              .size(60.dp)
                                                              .clip(RoundedCornerShape(8.dp))
                                                              .border(1.dp, Color.LightGray, RoundedCornerShape(8.dp)),
                                                          contentScale = ContentScale.Crop
                                                      )
                                                  } else {
                                                      Box(
                                                          modifier = Modifier
                                                              .size(60.dp)
                                                              .background(BrandGreen.copy(alpha = 0.1f), RoundedCornerShape(8.dp)),
                                                          contentAlignment = Alignment.Center
                                                      ) {
                                                          Icon(Icons.Default.Star, null, tint = BrandGreen)
                                                      }
                                                  }

                                                  Spacer(modifier = Modifier.width(14.dp))

                                                  Column(modifier = Modifier.weight(1f)) {
                                                      Text(item.title, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                                      if (item.idNumber.isNotBlank()) {
                                                          Text("নম্বর: ${item.idNumber}", fontSize = 13.sp, color = Color.DarkGray)
                                                      }
                                                      Text(
                                                          if (itemBitmap != null) "ছবি সংরক্ষিত (ট্যাপ করে বড় দেখুন)" else "কোনো ছবি নেই",
                                                          fontSize = 12.sp,
                                                          color = if (itemBitmap != null) BrandLeaf else Color.Gray,
                                                          fontWeight = FontWeight.Medium
                                                      )
                                                  }

                                                  IconButton(
                                                      onClick = {
                                                          if (!item.imagePath.isNullOrBlank()) {
                                                              File(item.imagePath).delete()
                                                          }
                                                          records.remove(item)
                                                          saveRecordsPermanently(context, userName, selectedCat!!.name, records)
                                                      }
                                                  ) {
                                                      Icon(Icons.Default.Delete, contentDescription = "Delete", tint = Color.Red.copy(alpha = 0.7f))
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // ছবি যোগ ও ক্রপ ডায়ালগ
                      if (showAddDialog) {
                          var docTitle by remember { mutableStateOf("") }
                          var docNum by remember { mutableStateOf("") }
                          var currentBitmap by remember { mutableStateOf<Bitmap?>(null) }

                          val imagePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                              if (uri != null) {
                                  try {
                                      context.contentResolver.openInputStream(uri)?.use { stream ->
                                          currentBitmap = BitmapFactory.decodeStream(stream)
                                      }
                                  } catch (e: Exception) {
                                      e.printStackTrace()
                                  }
                              }
                          }

                          Dialog(
                              onDismissRequest = { showAddDialog = false },
                              properties = DialogProperties(usePlatformDefaultWidth = false)
                          ) {
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth(0.92f)
                                      .wrapContentHeight()
                                      .padding(16.dp),
                                  shape = RoundedCornerShape(16.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White)
                              ) {
                                  Column(
                                      modifier = Modifier
                                          .padding(20.dp)
                                          .verticalScroll(rememberScrollState()),
                                      verticalArrangement = Arrangement.spacedBy(12.dp)
                                  ) {
                                      Text(
                                          text = "${selectedCat!!.titleBn}-এ নথি যোগ",
                                          fontSize = 18.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = BrandGreen
                                      )

                                      OutlinedTextField(
                                          value = docTitle,
                                          onValueChange = { docTitle = it },
                                          label = { Text("নথির নাম (যেমন: ড্রাইভিং লাইসেন্স)") },
                                          modifier = Modifier.fillMaxWidth()
                                      )

                                      OutlinedTextField(
                                          value = docNum,
                                          onValueChange = { docNum = it },
                                          label = { Text("নম্বর/আইডি নম্বর") },
                                          modifier = Modifier.fillMaxWidth()
                                      )

                                      if (currentBitmap != null) {
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(200.dp)
                                                  .clip(RoundedCornerShape(10.dp))
                                                  .background(Color.Black.copy(alpha = 0.05f)),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Image(
                                                  bitmap = currentBitmap!!.asImageBitmap(),
                                                  contentDescription = "Selected Photo",
                                                  modifier = Modifier.fillMaxSize(),
                                                  contentScale = ContentScale.Fit
                                              )
                                          }

                                          Row(
                                              modifier = Modifier.fillMaxWidth(),
                                              horizontalArrangement = Arrangement.SpaceEvenly
                                          ) {
                                              OutlinedButton(
                                                  onClick = { currentBitmap = rotateBitmap(currentBitmap!!, 90f) },
                                                  contentPadding = PaddingValues(horizontal = 8.dp)
                                              ) {
                                                  Icon(Icons.Default.Refresh, null, modifier = Modifier.size(16.dp))
                                                  Spacer(modifier = Modifier.width(4.dp))
                                                  Text("ঘোরান")
                                              }

                                              OutlinedButton(
                                                  onClick = { currentBitmap = cropToSquare(currentBitmap!!) },
                                                  contentPadding = PaddingValues(horizontal = 8.dp)
                                              ) {
                                                  Icon(Icons.Default.Check, null, modifier = Modifier.size(16.dp))
                                                  Spacer(modifier = Modifier.width(4.dp))
                                                  Text("ক্রপ")
                                              }

                                              OutlinedButton(
                                                  onClick = { currentBitmap = null },
                                                  colors = ButtonDefaults.outlinedButtonColors(contentColor = Color.Red),
                                                  contentPadding = PaddingValues(horizontal = 8.dp)
                                              ) {
                                                  Icon(Icons.Default.Delete, null, modifier = Modifier.size(16.dp))
                                                  Spacer(modifier = Modifier.width(4.dp))
                                                  Text("বাদ")
                                              }
                                          }
                                      } else {
                                          Button(
                                              onClick = { imagePicker.launch("image/*") },
                                              colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Icon(Icons.Default.Add, null)
                                              Spacer(modifier = Modifier.width(6.dp))
                                              Text("গ্যালারি থেকে ছবি যুক্ত করুন")
                                          }
                                      }

                                      Spacer(modifier = Modifier.height(8.dp))

                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          OutlinedButton(
                                              onClick = { showAddDialog = false },
                                              modifier = Modifier.weight(1f)
                                          ) {
                                              Text("বাতিল")
                                          }

                                          Button(
                                              onClick = {
                                                  if (docTitle.isNotBlank()) {
                                                      var savedPhotoPath: String? = null
                                                      if (currentBitmap != null) {
                                                          val fileName = "doc_${System.currentTimeMillis()}.jpg"
                                                          savedPhotoPath = saveBitmapToStorage(context, currentBitmap!, fileName)
                                                      }

                                                      val newItem = RecordItem(
                                                          id = java.util.UUID.randomUUID().toString(),
                                                          title = docTitle,
                                                          idNumber = docNum,
                                                          imagePath = savedPhotoPath
                                                      )
                                                      records.add(newItem)
                                                      saveRecordsPermanently(context, userName, selectedCat!!.name, records)
                                                      showAddDialog = false
                                                  }
                                              },
                                              colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                                              modifier = Modifier.weight(1f)
                                          ) {
                                              Text("সংরক্ষণ করুন")
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // ফুল-স্ক্রিন ফটো ভিউয়ার
                      if (previewImagePath != null) {
                          val fullBitmap = remember(previewImagePath) { loadBitmapFromPath(previewImagePath) }
                          Dialog(
                              onDismissRequest = { previewImagePath = null },
                              properties = DialogProperties(usePlatformDefaultWidth = false)
                          ) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .background(Color.Black.copy(alpha = 0.95f))
                              ) {
                                  if (fullBitmap != null) {
                                      Image(
                                          bitmap = fullBitmap.asImageBitmap(),
                                          contentDescription = "Full Preview",
                                          modifier = Modifier
                                              .fillMaxSize()
                                              .padding(16.dp),
                                          contentScale = ContentScale.Fit
                                      )
                                  }

                                  IconButton(
                                      onClick = { previewImagePath = null },
                                      modifier = Modifier
                                          .align(Alignment.TopEnd)
                                          .padding(16.dp)
                                          .background(Color.White.copy(alpha = 0.2f), CircleShape)
                                  ) {
                                      Icon(Icons.Default.Close, contentDescription = "Close", tint = Color.White)
                                  }
                              }
                          }
                      }

                      // প্রোফাইল ফটো ডায়ালগ
                      if (showProfileDialog) {
                          val profilePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                              if (uri != null) {
                                  try {
                                      context.contentResolver.openInputStream(uri)?.use { stream ->
                                          val b = BitmapFactory.decodeStream(stream)
                                          val fileName = "profile_${userName}.jpg"
                                          val path = saveBitmapToStorage(context, b, fileName)
                                          userPrefs.edit().putString("profile_pic_$userName", path).apply()
                                          profilePhotoPath = path
                                      }
                                  } catch (e: Exception) {
                                      e.printStackTrace()
                                  }
                              }
                          }

                          Dialog(onDismissRequest = { showProfileDialog = false }) {
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(16.dp),
                                  shape = RoundedCornerShape(16.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White)
                              ) {
                                  Column(
                                      modifier = Modifier.padding(24.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.spacedBy(16.dp)
                                  ) {
                                      Text("আমার প্রোফাইল", fontWeight = FontWeight.Bold, fontSize = 20.sp, color = BrandGreen)

                                      Box(
                                          modifier = Modifier
                                              .size(90.dp)
                                              .clip(CircleShape)
                                              .border(2.dp, BrandLeaf, CircleShape)
                                              .background(BrandGreen.copy(alpha = 0.1f)),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          if (profileBitmap != null) {
                                              Image(
                                                  bitmap = profileBitmap.asImageBitmap(),
                                                  contentDescription = null,
                                                  modifier = Modifier.fillMaxSize(),
                                                  contentScale = ContentScale.Crop
                                              )
                                          } else {
                                              Icon(Icons.Default.Person, null, tint = BrandGreen, modifier = Modifier.size(50.dp))
                                          }
                                      }

                                      Text("আইডি: $userName", fontWeight = FontWeight.SemiBold, fontSize = 16.sp)

                                      Button(
                                          onClick = { profilePicker.launch("image/*") },
                                          colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                                          modifier = Modifier.fillMaxWidth()
                                      ) {
                                          Icon(Icons.Default.Edit, null)
                                          Spacer(modifier = Modifier.width(6.dp))
                                          Text("প্রোফাইল ছবি পরিবর্তন")
                                      }

                                      if (profilePhotoPath != null) {
                                          OutlinedButton(
                                              onClick = {
                                                  userPrefs.edit().remove("profile_pic_$userName").apply()
                                                  profilePhotoPath = null
                                              },
                                              colors = ButtonDefaults.outlinedButtonColors(contentColor = Color.Red),
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Icon(Icons.Default.Delete, null)
                                              Spacer(modifier = Modifier.width(6.dp))
                                              Text("ছবি মুছে ফেলুন")
                                          }
                                      }

                                      TextButton(onClick = { showProfileDialog = false }) {
                                          Text("বন্ধ করুন", color = Color.Gray)
                                      }
                                  }
                              }
                          }
                      }

                      // ৪০ সেকেন্ড ইনকামিং কল স্ক্রিন (Ringing Screen Overlay)
                      if (incomingCallName != null) {
                          Dialog(
                              onDismissRequest = {
                                  NotificationService.stopCallRingtone(context)
                                  incomingCallName = null
                              },
                              properties = DialogProperties(usePlatformDefaultWidth = false)
                          ) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .background(Color(0xFF071B16)),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center,
                                      modifier = Modifier.padding(24.dp)
                                  ) {
                                      Text("ইনকামিং অডিও কল...", color = BrandLeaf, fontSize = 16.sp)
                                      Spacer(modifier = Modifier.height(16.dp))

                                      Box(
                                          modifier = Modifier
                                              .size(120.dp)
                                              .clip(CircleShape)
                                              .background(Color.White.copy(alpha = 0.1f))
                                              .border(3.dp, BrandLeaf, CircleShape),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Icon(Icons.Default.Person, null, tint = Color.White, modifier = Modifier.size(70.dp))
                                      }

                                      Spacer(modifier = Modifier.height(20.dp))
                                      Text(incomingCallName!!, fontWeight = FontWeight.Bold, fontSize = 24.sp, color = Color.White)
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text("রিং বাজছে... (৪০ সেকেন্ড)", color = Color.LightGray, fontSize = 13.sp)

                                      Spacer(modifier = Modifier.height(60.dp))

                                      // রিসিভ ও কাটার বোতাম
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceEvenly,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          // কেটে দেওয়া (Decline)
                                          FloatingActionButton(
                                              onClick = {
                                                  NotificationService.stopCallRingtone(context)
                                                  incomingCallName = null
                                              },
                                              containerColor = Color.Red,
                                              contentColor = Color.White,
                                              modifier = Modifier.size(68.dp),
                                              shape = CircleShape
                                          ) {
                                              Icon(Icons.Default.CallEnd, contentDescription = "Decline", modifier = Modifier.size(32.dp))
                                          }

                                          // রিসিভ করা (Accept)
                                          FloatingActionButton(
                                              onClick = {
                                                  NotificationService.stopCallRingtone(context)
                                                  incomingCallName = null
                                              },
                                              containerColor = BrandLeaf,
                                              contentColor = Color.White,
                                              modifier = Modifier.size(68.dp),
                                              shape = CircleShape
                                          ) {
                                              Icon(Icons.Default.Call, contentDescription = "Accept", modifier = Modifier.size(32.dp))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Shapla APK বিল্ড করা হচ্ছে
        run: gradle assembleDebug --stacktrace

      - name: তৈরি হওয়া APK সংরক্ষণ ও ডাউনলোড লিঙ্ক প্রস্তুত
        uses: actions/upload-artifact@v4
        with:
          name: Shapla-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
