          @Composable
          fun CallOverlay(caller: String, onEnd: () -> Unit) {
              Dialog(onDismissRequest = onEnd) {
                  Box(modifier = Modifier.fillMaxSize().background(Color(0xFF071B16)), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("ইনকামিং কল...", color = ShaplaLeafGreen, fontSize = 16.sp)
                          Spacer(modifier = Modifier.height(14.dp))
                          Text(caller, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                          Text("পিং-পিং রিং বাজছে... (৪০ সেকেন্ড)", color = Color.LightGray, fontSize = 12.sp)
                          Spacer(modifier = Modifier.height(40.dp))
                          FloatingActionButton(onClick = onEnd, containerColor = Color.Red, shape = CircleShape) {
                              Icon(Icons.Default.Close, null, tint = Color.White)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Shapla APK
        uses: actions/upload-artifact@v4
        with:
          name: Shapla-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
